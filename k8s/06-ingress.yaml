# Not: /api ve / farklı servislere gidiyor, rewrite YOK — backend rotaları
# zaten /api/todos gibi tanımlı (bkz. docs/api.md), path aynen iletiliyor.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo
spec:
  ingressClassName: nginx
  rules:
    - host: todo.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
